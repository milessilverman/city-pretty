name: Source links
# Re-checks every source URL in app/data once a month (and on demand). Fails only when a link that worked, or was
# merely blocking bots, now returns 404/410 or no longer resolves. The full report is attached to the run.
on:
  schedule:
    - cron: "17 14 3 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source links
        run: python3 scripts/check_sources.py
      - name: Attach report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-report
          path: data/source_link_report.json
