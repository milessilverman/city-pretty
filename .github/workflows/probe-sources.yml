name: Probe sources from runner
# Probes each ranked public API and data source from a GitHub Actions runner IP to test
# network accessibility, status, and datacenter IP bot-gating.

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run probe script
        run: python3 scripts/probe_sources_runner.py
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-probe-report
          path: data/runner_probe_report.json
