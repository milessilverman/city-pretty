name: Deploy site to Cloudflare

# Builds dist-site/ and deploys the site Worker (wrangler.site.toml). Needs the repository secret
# CLOUDFLARE_API_TOKEN (a token with Workers edit rights) and CLOUDFLARE_ACCOUNT_ID. Run it by hand from the Actions
# tab, or it runs when site files change on the default branch. See docs/HOSTING.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, "app/**", "src/**", "counties/manifest.json", "counties/sites_*.json.gz", "workers/site.ts", "wrangler.site.toml", "scripts/build_site_dist.mjs"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            app
            src
            workers/site.ts
            wrangler.site.toml
            scripts/build_site_dist.mjs
            docs/DECISION-ENGINE.md
            counties/manifest.json
            counties/sites_*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build_site_dist.mjs
      - run: npx wrangler@4.165.0 deploy -c wrangler.site.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
