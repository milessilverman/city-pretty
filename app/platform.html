<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Pretty: investment screening pilot (Los Angeles County)</title>
<style>
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1a1a1a; background: #fff; margin: 0 auto; max-width: 1200px; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  h2 { font-size: 1.1rem; margin: 28px 0 8px; }
  .banner { border: 1px solid #999; border-left: 6px solid #b36b00; padding: 12px 16px; background: #fff8ec; }
  .banner p { margin: 6px 0; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 8px 0; padding: 0; list-style: none; }
  .counts strong { font-size: 1.15rem; }
  .error { border: 2px solid #b00020; color: #b00020; padding: 12px; font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
  label { display: flex; flex-direction: column; font-size: .85rem; gap: 2px; }
  select { font: inherit; padding: 4px; }
  .scroll { overflow-x: auto; border: 1px solid #ccc; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { border-bottom: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: #f1f1f1; position: sticky; top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; }
  details ul { margin: 4px 0; padding-left: 18px; }
  .note { color: #444; font-size: .85rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #161616; color: #eee; }
    .banner { background: #2a2113; border-color: #777; border-left-color: #e0a040; }
    th { background: #262626; }
    th, td, .scroll { border-color: #444; }
    .note { color: #bbb; }
    .error { color: #ff7a8a; border-color: #ff7a8a; }
  }
</style>
</head>
<body>
<h1>City Pretty: investment screening pilot (Los Angeles County)</h1>
<main id="root"><p>Loading platform_pilot_la.json...</p></main>
<script type="module" src="./platform.js"></script>
</body>
</html>
